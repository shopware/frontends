version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 4
      exclude: ["@shopware/*"]
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore: []
    groups:
      nuxt-vue:
        applies-to: "version-updates"
        patterns:
          - "nuxt"
          - "nuxi"
          - "nuxt-*"
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vueuse/*"
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "unocss"
          - "@unocss/*"
          - "@iconify*"
        update-types: ["minor", "patch"]
      other-dependencies:
        applies-to: "version-updates"
        patterns: ["*"]
        exclude-patterns:
          - "nuxt"
          - "nuxi"
          - "nuxt-*"
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vueuse/*"
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "unocss"
          - "@unocss/*"
          - "@iconify*"
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
