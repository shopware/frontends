# Lives outside code-check.yml because that workflow ignores apps/** and *.md,
# while half of this check points into apps/docs/src/. A PR that only deletes a
# docs page must still fail here, not on the next unrelated PR.
name: Templates manifest

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "templates/**"
      - "scripts/checkTemplatesManifest.ts"
      - "apps/docs/src/**"
      - "apps/docs/.vitepress/**"
      - ".devcontainer/**"
      - ".github/workflows/templates-manifest.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "templates/**"
      - "scripts/checkTemplatesManifest.ts"
      - "apps/docs/src/**"
      - "apps/docs/.vitepress/**"
      - ".devcontainer/**"
      - ".github/workflows/templates-manifest.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  check:
    name: Templates manifest
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check templates/manifest.json
        run: pnpm run check:templates
