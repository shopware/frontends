packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - "examples/*"

# Reducing the risk of installing fresh compromised packages before detected.
# Keep .github/dependabot.yml cooldown.default-days in lockstep (4320 min = 3 days).
minimumReleaseAge: 4320 ## 3 days
minimumReleaseAgeExclude:
  - "@shopware/*"

overrides:
  "editorconfig>minimatch": "^9.0.9"
  "@vercel/blob>undici": "^6.28.0"
  less: ^4.8.1
  "qs@<6.16.0": 6.16.0
  "fast-uri@<3.1.6": 3.1.6
  "@tiptap/pm@<3.30.4": 3.30.4
  "nanoid@<3.3.18": "^3.3.18"
  esbuild: ^0.28.2
  vite: ^8.2.1
  "@vueuse/core": 14.4.0
  "@vueuse/shared": 14.4.0
  "@vueuse/metadata": 14.4.0
  "@vueuse/integrations": 14.4.0
  vue: 3.5.42
  "@vue/compiler-core": 3.5.42
  "@vue/compiler-dom": 3.5.42
  "@vue/compiler-sfc": 3.5.42
  "@vue/compiler-ssr": 3.5.42
  "@vue/reactivity": 3.5.42
  "@vue/runtime-core": 3.5.42
  "@vue/runtime-dom": 3.5.42
  "@vue/server-renderer": 3.5.42
  "@vue/shared": 3.5.42
  browserslist: 4.28.9
  "@tiptap/core": 3.30.4
  "fflate@<0.6.11": "^0.6.11"

peerDependencyRules:
  ignoreMissing:
    - webpack
    - vite
    - react-dom
    - react
    - "@types/react"
    - "@algolia/client-search"
shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
enablePrePostScripts: true
preferFrozenLockfile: true
preferOffline: true
verifyDepsBeforeRun: false
linkWorkspacePackages: deep
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  oxfmt: true
  oxlint: true
  sharp: true
  vue-demi: true
