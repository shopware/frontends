packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - "examples/*"

templates:
  - "templates/*"

# Reduciing the risk of installing fresh compromised packages before detected
minimumReleaseAge: 4320 ## 3 days
minimumReleaseAgeExclude:
  - "@shopware/*"
  - "@typescript/native-preview"
  - "happy-dom"
  - "@vue/test-utils"
  - "@adyen/adyen-web"

overrides:
  axios: ^1.18.0
  minimatch: ^10.2.5
  undici: ^6.28.1
  dompurify: ^3.4.11 # GHSA-cmwh-pvxp-8882 (transitive via isomorphic-dompurify)
  "jsdom>undici": "^7.29.1"
  unbuild: ^3.6.1
  uuid: ^14.0.0
  esbuild: ^0.28.1
  ws: ^8.21.0
  form-data: ^4.0.6
  vite: ^8.0.16
  vue: 3.5.38
  "@vue/compiler-core": 3.5.38
  "@vue/compiler-dom": 3.5.38
  "@vue/compiler-sfc": 3.5.38
  "@vue/compiler-ssr": 3.5.38
  "@vue/reactivity": 3.5.38
  "@vue/runtime-core": 3.5.38
  "@vue/runtime-dom": 3.5.38
  "@vue/server-renderer": 3.5.38
  "@vue/shared": 3.5.38
  launch-editor: ^2.14.1
  js-yaml: ^4.3.2
  markdown-it: ^14.3.1
  "@babel/core": "^7.29.6"
  tar: ^7.5.21
  svgo: ^4.1.0
  fast-uri: ^3.1.8
  sharp: ^0.35.4
  postcss: ^8.5.23
  valibot: ^1.4.2
  brace-expansion: ^5.0.12
  shell-quote: ^1.8.5
  browserslist: ^4.28.7
  qs: ^6.16.0
  smol-toml: ^1.7.1
  devalue: ^5.9.1
  baseline-browser-mapping: ^2.11.0
  "nanoid@<4": ^3.3.18
  "fflate@<0.7": ^0.6.11

peerDependencyRules:
  ignoreMissing:
    - webpack
    - vite
    - react-dom
    - react
    - "@types/react"
    - "@algolia/client-search"
shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
enablePrePostScripts: true
preferFrozenLockfile: true
preferOffline: true
verifyDepsBeforeRun: false
linkWorkspacePackages: deep
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  oxfmt: true
  oxlint: true
  sharp: true
  vue-demi: true
