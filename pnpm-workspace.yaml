packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - "examples/*"

# Reduciing the risk of installing fresh compromised packages before detected
minimumReleaseAge: 4320 ## 3 days
minimumReleaseAgeExclude:
  - "@shopware/*"

overrides:
  "@vercel/blob>undici": "^6.29.1"
  "@tiptap/pm@<3.30.5": 3.30.5
  esbuild: ^0.28.2
  vite: ^8.3.4
  "@vueuse/core": 14.4.0
  "@vueuse/shared": 14.4.0
  "@vueuse/metadata": 14.4.0
  "@vueuse/integrations": 14.4.0
  vue: 3.5.42
  "@vue/compiler-core": 3.5.42
  "@vue/compiler-dom": 3.5.42
  "@vue/compiler-sfc": 3.5.42
  "@vue/compiler-ssr": 3.5.42
  "@vue/reactivity": 3.5.42
  "@vue/runtime-core": 3.5.42
  "@vue/runtime-dom": 3.5.42
  "@vue/server-renderer": 3.5.42
  "@vue/shared": 3.5.42
  "@tiptap/core": 3.30.5
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "sharp@<0.35.5": 0.35.5
  "astro@<7.4.2": 7.4.2
  "tinypool@<2.1.2": 2.1.2
  "postcss-selector-parser@<7.1.6": 7.1.6
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.2": 8.12.3
  "fast-uri@<3.1.9": 3.1.9
  "qs@<6.16.1": 6.16.1
  "serialize-javascript@<7.1.3": 7.1.3
  "zod@>=4.0.0 <4.6.6": 4.6.6
  "follow-redirects@<1.16.1": 1.16.1
  "launch-editor@<2.14.2": 2.14.2
  "@nuxt/devtools@>=3.0.0 <3.4.3": ^3.4.3

peerDependencyRules:
  ignoreMissing:
    - webpack
    - vite
    - react-dom
    - react
    - "@types/react"
    - "@algolia/client-search"
shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
enablePrePostScripts: true
preferFrozenLockfile: true
preferOffline: true
verifyDepsBeforeRun: false
linkWorkspacePackages: deep
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  oxfmt: true
  oxlint: true
  sharp: true
  vue-demi: true

# Advisories with no usable patched release yet. Drop each entry once its fix ships.
auditConfig:
  ignoreGhsas:
    # node-forge: advisory names >=1.4.1, not published yet. Used by listhen for local dev HTTPS certs only.
    - GHSA-86w9-cpqp-85rv
    # braces: advisory names >=3.0.4, not published yet. Only matches build-time glob patterns we write.
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge: advisory has no patched release yet. Build-time dependency of unbuild only.
    - GHSA-gcqx-w48m-w2h4
