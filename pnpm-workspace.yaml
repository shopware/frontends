packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - "examples/*"

# Reduciing the risk of installing fresh compromised packages before detected
minimumReleaseAge: 4320 ## 3 days
minimumReleaseAgeExclude:
  - "@shopware/*"

overrides:
  "editorconfig>minimatch": "^9.0.9"
  "@vercel/blob>undici": "^6.28.0"
  less: ^4.8.1
  "qs@<6.16.0": 6.16.0
  "fast-uri@<3.1.8": 3.1.8
  "undici@>=8.0.0 <8.10.2": 8.10.2
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "@tiptap/pm@<3.30.5": 3.30.5
  "nanoid@<3.3.18": "^3.3.18"
  esbuild: ^0.28.2
  vite: ^8.3.3
  "@vueuse/core": 14.4.0
  "@vueuse/shared": 14.4.0
  "@vueuse/metadata": 14.4.0
  "@vueuse/integrations": 14.4.0
  vue: 3.5.43
  "@vue/compiler-core": 3.5.43
  "@vue/compiler-dom": 3.5.43
  "@vue/compiler-sfc": 3.5.43
  "@vue/compiler-ssr": 3.5.43
  "@vue/reactivity": 3.5.43
  "@vue/runtime-core": 3.5.43
  "@vue/runtime-dom": 3.5.43
  "@vue/server-renderer": 3.5.43
  "@vue/shared": 3.5.43
  browserslist: 4.28.9
  "@tiptap/core": 3.30.5
  "fflate@<0.6.11": "^0.6.11"
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "svgo@>=4.0.0 <4.1.0": 4.1.0
  "smol-toml@<1.8.1": 1.9.0
  "sharp@<0.35.5": 0.35.5
  "astro@<7.2.8": 7.2.8
  "vitest@>=2.1.0 <4.1.11": 4.1.11
  "@vitest/mocker@>=2.1.0 <4.1.11": 4.1.11
  "devalue@<5.9.3": 5.9.3
  "seroval@<1.6.3": 1.6.3
  "@simple-git/argv-parser@<2.0.1": 2.0.1
  "tinypool@<2.1.2": 2.1.2
  "shell-quote@>=1.8.4 <1.11.0": 1.11.0
  "http-cache-semantics@<4.2.1": 4.3.0
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "postcss-selector-parser@<7.1.6": 7.1.6

peerDependencyRules:
  ignoreMissing:
    - webpack
    - vite
    - react-dom
    - react
    - "@types/react"
    - "@algolia/client-search"
shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
enablePrePostScripts: true
preferFrozenLockfile: true
preferOffline: true
verifyDepsBeforeRun: false
linkWorkspacePackages: deep
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  oxfmt: true
  oxlint: true
  sharp: true
  vue-demi: true

# Advisories with no usable patched release yet. Drop each entry once its fix ships.
auditConfig:
  ignoreGhsas:
    # simple-git: fixed only in v4, which removed the default export @nuxt/devtools 3 imports (needs devtools 4, still beta). Dev-only, local git calls.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    # node-forge: advisory names >=1.4.1, not published yet. Used by listhen for local dev HTTPS certs only.
    - GHSA-86w9-cpqp-85rv
    # braces: advisory names >=3.0.4, not published yet. Only matches build-time glob patterns we write.
    - GHSA-vfj7-8cjw-p6xm
